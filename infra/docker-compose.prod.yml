# Production stack for a single VPS.
#
# Usage (always pass --env-file so DOMAIN/ADMIN_EMAIL/etc. are available
# for variable interpolation below — web's build arg, caddy's scoped
# environment: block — and for api's env_file: directive. Compose only
# auto-loads a file literally named ".env", hence the explicit flag):
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Required file: infra/.env.prod (not committed — see infra/README.md
# for the full variable contract and how to generate it).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: english_app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d english_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only reachable on the internal compose
    # network (by api, and by backup.sh via `docker compose exec`).

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      # Persists uploaded media across redeploys/container recreation when
      # STORAGE_DRIVER=local. Mounted at /app/storage because the api
      # image's WORKDIR is /app and LocalStorageService defaults STORAGE_DIR
      # to "./storage" (i.e. /app/storage) when STORAGE_DIR is unset in
      # .env.prod. If you set an absolute STORAGE_DIR in .env.prod instead,
      # update this mount path to match. In production STORAGE_DRIVER is
      # expected to be "s3" (see §2 of README.md), in which case this volume
      # simply sits unused — it's here so switching back to the local
      # driver (or running without S3 configured) doesn't silently lose
      # uploads on every `up -d --build`.
      - mediadata:/app/storage

  web:
    build:
      context: ../apps/web
      args:
        # Baked into the client bundle at build time — must be the public
        # HTTPS URL Caddy will terminate for the api.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    # No runtime env needed: NEXT_PUBLIC_API_URL is baked into the client
    # bundle at build time via the build arg above, and web has no other
    # server-side config. Deliberately no env_file here — it would expose
    # DATABASE_URL/JWT_SECRET/S3 keys/ADMIN_PASSWORD to a container that
    # never reads them.
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Scoped to exactly what Caddyfile references (DOMAIN, ADMIN_EMAIL for
    # the ACME account contact) — not the full .env.prod, which also holds
    # DATABASE_URL/JWT_SECRET/S3 keys/ADMIN_PASSWORD that caddy never needs.
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
  mediadata:
